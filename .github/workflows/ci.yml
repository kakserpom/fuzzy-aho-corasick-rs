name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --all-features
      # Fail loudly if the mdBook chapters stopped being compile-checked.
      #
      # `build.rs` enables those doctests via a `book_present` cfg, gated on `book/src` existing so
      # the packaged crate -- which excludes `/book` -- can still compile. But `cargo package` and
      # `cargo publish` verify the packaged crate in the *same* `target/` directory, so they leave
      # behind a second execution of this build script whose output lacks `book_present`, and cargo
      # will happily reuse that one afterwards. The symptom is silent: the suite still passes, it
      # just runs 21 doctests instead of 48, and the book examples stop being checked against the
      # API. This bit twice locally before it was noticed, so it is asserted rather than assumed.
      #
      # Keyed on a book path rather than a count, so adding a doctest does not break the check.
      - name: Book examples are compile-checked
        run: |
          cargo test --doc -- --list > doctests.txt
          if ! grep -q 'book/src/' doctests.txt; then
            echo "::error::no mdBook chapter doctests were collected."
            echo "The book examples are not being compile-checked (build.rs's 'book_present' cfg"
            echo "did not survive). Try 'cargo clean -p fuzzy-aho-corasick' and re-run."
            echo "Doctests collected: $(grep -c ': test$' doctests.txt)"
            exit 1
          fi
          echo "$(grep -c 'book/src/' doctests.txt) book doctests collected"

  miri:
    name: Miri
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Allow host time/getrandom access if a test ever needs it; does not weaken UB detection.
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # Miri is ~100x slower, so the full suite can't finish in a reasonable time. Run a small set of
      # tiny tests that still exercise the `unsafe` grapheme paths (ASCII + Unicode
      # `from_utf8_unchecked`) under fuzzy search — enough to catch UB there. Doctests aren't run
      # under Miri.
      #
      # The two table/boundary tests are here for the same reason and are cheap enough not to matter:
      # `ascii_byte_table` walks the whole input domain of the crate's only `unsafe` block, and
      # `reverse_grapheme_iteration` checks the backwards grapheme walk the streaming commit
      # boundary depends on. Neither runs a search, so neither is affected by Miri's slowdown. The
      # heavier property sweeps are deliberately left out — they would blow the timeout, and the code
      # they exercise is already covered here through the search tests above.
      - run: >-
          cargo miri test --
          exact_match extra_letter missing_letter substitution swap
          case_insensitive unicode ascii_byte_table reverse_grapheme_iteration

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
