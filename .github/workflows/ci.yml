name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --all-features

  miri:
    name: Miri
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Allow host time/getrandom access if a test ever needs it; does not weaken UB detection.
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # Miri is ~100x slower, so the full suite can't finish in a reasonable time. Run a small set of
      # tiny tests that still exercise the `unsafe` grapheme paths (ASCII + Unicode
      # `from_utf8_unchecked`) under fuzzy search — enough to catch UB there. Doctests aren't run
      # under Miri.
      - run: cargo miri test -- exact_match extra_letter missing_letter substitution swap case_insensitive unicode

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
